<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[[NEON_TEMPLATE_TITLE]]</title>
</head>
<body style="margin:0;padding:0;background-color:#fbd3d3;color:#000000;font-family:'Courier New',Courier,monospace;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background-color:#fbd3d3;">
    <tr>
      <td align="center" style="padding:40px 16px;">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:620px;">
          <tr>
            <td align="center" bgcolor="#000000" style="background-color:#000000;border:3px solid #000000;border-radius:32px 32px 0 0;padding:40px 28px;">
              <div style="font-size:58px;line-height:1;margin-bottom:16px;color:#ffffff;">[[HERO_SYMBOL]]</div>
              <div style="font-family:Arial Black,Arial,sans-serif;font-size:38px;line-height:1.05;font-weight:900;text-transform:uppercase;color:#ffffff;">[[HERO_HEADING]]</div>
              <p style="max-width:470px;margin:20px auto 0;font-size:17px;line-height:1.6;font-weight:700;color:#ffffff;">[[HERO_TEXT]]</p>
            </td>
          </tr>
          <tr>
            <td bgcolor="#ffffff" style="background-color:#ffffff;border:3px solid #000000;border-top:0;border-radius:0 0 32px 32px;padding:42px 36px;box-shadow:8px 8px 0 #000000;">
              <div style="display:inline-block;background-color:#67e8f9;border:3px solid #000000;border-radius:999px;padding:7px 14px;font-size:12px;line-height:1;font-weight:700;text-transform:uppercase;">[[LABEL]]</div>
              <h1 style="margin:24px 0 16px;font-family:Arial Black,Arial,sans-serif;font-size:34px;line-height:1.1;font-weight:900;text-transform:uppercase;color:#000000;">[[HEADING]]</h1>
              [[BODY_HTML]]
              [[NEON_REQUIRED_BLOCK]]
              [[PRIMARY_BUTTON]]
              [[SECONDARY_HTML]]
              <p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#555555;">[[CLOSING_NOTE]]</p>
            </td>
          </tr>
          [[OFFICIAL_FOOTER_ROW]]
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
